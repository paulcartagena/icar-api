spring:
  application:
    name: icar-api

server:
  port: ${PORT:8080}
  # Take the client IP and scheme from X-Forwarded-* only when the request comes from a private-network proxy
  # (the load balancer), so clients can't fake their IP to skip the login rate limit
  forward-headers-strategy: native

# Frontend origins allowed to call the API (comma-separated). Set CORS_ALLOWED_ORIGINS in production.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Only /actuator/health is exposed (public, for the deploy health check); it reports UP/DOWN without details
management:
  endpoints:
    web:
      exposure:
        include: health

# API docs (/scalar and /v3/api-docs): open by default, closed in prod unless API_DOCS_ENABLED=true
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
scalar:
  enabled: ${API_DOCS_ENABLED:true}

jwt:
  secret: ${JWT_SECRET}

# Only used on startup when no ADMIN user exists yet (see InitialAdminCreator)
admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
  full-name: ${ADMIN_FULL_NAME:}
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${LOCAL_URL_DB}
    username: ${LOCAL_USERNAME_DB}
    password: ${LOCAL_PASSWORD_DB}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_URL_DB}
    username: ${PROD_USERNAME_DB}
    password: ${PROD_PASSWORD_DB}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
scalar:
  enabled: ${API_DOCS_ENABLED:false}
